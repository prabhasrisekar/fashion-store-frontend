<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Sign In</title>
</head>
<body>
    <div class="container product-head">
        <span><a href="index.html"><i class="bi bi-arrow-left" style="font-size: 35px; color: black;"></i></a></span>
        <span><h1 class="product-head">Sign In</h1></span>
    </div>
    <hr>
    <div class="container-fluid sign">
    <form  class="d-flex-col ms-5 mt-5">
        <div class="form-group">
            <input class="form-control"type="email" id="email"placeholder="Email"required>
            <label class="form-label"for="email"></label>
        </div>

        <div class="form-group">
            <input class=form-control type="password"id="password" placeholder="Password"required>
            <label class="form-label"for="password"></label>
        </div>

        <div class="form-group form-check">
            <input class="form-check-input "type="checkbox" id="check" placeholder="Password">
            <label class="form-check-label"for="checkbox">Remember Me</label>
        </div><br>

        <div class="signin">
           <button class="btn text-white w-100">Sign In</button>
        </div><br>

        <div  style="margin-left: 180px; color:rgb(153, 149, 149)">
            <h6>or sign In With</h6>
        </div><br>

        <div class="facebook ">
            <button class="btn text-white w-100">Facebook</button>
        </div><br>

        <div class="google">
            <button class="btn text-white w-100">Google</button>
         </div><br>

         <div class="d-flex" style="gap:30px"> 
            <span><h6 style="margin-left: 90px; color:rgb(153, 149, 149)">Don't have an account ?</h6></span>
            <span><a href="#"class="fw-bold" style="text-decoration: none;">Sign Up</a></span>
         </div><br><br><br>
       
         

    </form>
    </div>
    

     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>  
</body>
</html>
